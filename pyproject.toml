[project]
name = "mkdocstocanvas"
version = "3.0.0.dev4"
description = "Upload MkDocs course content to Canvas LMS"
authors = [
  { name="Nithit Sathornkit", email="nithit@chalmers.se" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.5.0",
    "pymdown-extensions>=10.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "mkdocs-excel-plugin>=1.0.0",
    "mkdocs-page-pdf>=0.4.0",
]
license = "MPL-2.0"
license-files = ["LICENSE"]

[project.scripts]
mkdocstocanvas = "mkdocstocanvas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocstocanvas"]

[tool.pyright]
venvPath = "."
venv = ".venv"
