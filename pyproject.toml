[project]
name = "mkdocstocanvas"
version = "3.0.0.dev5"
description = "Upload MkDocs course content to Canvas LMS"
authors = [
  { name="Nithit Sathornkit", email="nithit@chalmers.se" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.5.0",
    "pymdown-extensions>=10.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "mkdocs-excel-plugin>=1.0.0",
    "mkdocs-page-pdf>=0.4.0",
]
license = "MPL-2.0"
license-files = ["LICENSE"]

[project.scripts]
mkdocstocanvas = "mkdocstocanvas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocstocanvas"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",   # pycodestyle errors
    "E7",   # pycodestyle errors
    "E9",   # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # modernize syntax (PEP 585/604 etc.)
    "B",    # bugbear: likely bugs
    "C4",   # comprehension/collection simplifications
    "SIM",  # code simplification
    "PERF", # performance lints
    "PLW",  # pylint warnings subset
    "RUF",  # ruff-specific rules
]
ignore = [
    # Broad `except Exception` is deliberate in several places: per-item
    # failures (uploads, cell colors, PDF matching) are reported and the
    # run continues instead of aborting the whole command.
    "BLE001",
    # Cache timestamps (`last_upload`) are local-time display metadata.
    "DTZ005",
    # subprocess return codes are checked manually after each run in cli.py.
    "PLW1510",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
