[project]
name = "mkdocstocanvas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "markdown>=3.10.2",
    "pymdown-extensions>=10.21",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rich>=13.0.0",
    "typer>=0.23.2",
    "mkdocs-material>=9.7.1",
    "mkdocs-include-markdown-plugin>=7.2.1",
    "mkdocs-excel-plugin>=1.0.0",
    "mkdocs-page-pdf>=0.4.0",
]

[project.scripts]
mkdocstocanvas = "mkdocstocanvas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkdocstocanvas"]

[tool.pyright]
venvPath = "."
venv = ".venv"
